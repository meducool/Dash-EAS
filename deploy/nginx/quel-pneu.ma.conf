# Nginx virtual host for www.quel-pneu.ma
# This is the HTTP-only version — Certbot will add SSL automatically.
#
# IMPORTANT: when running certbot, use `--redirect` so HTTP is 301'd to HTTPS.
# Without that, auth tokens can leak over plaintext. See README.md §7.

server {
    listen 80;
    listen [::]:80;
    server_name quel-pneu.ma www.quel-pneu.ma;

    # Laravel backend root
    root /var/www/quel-pneu.ma/back/public;
    index index.php;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS — only honored by browsers when served over HTTPS. Safe to set on
    # the HTTP block because Certbot moves it to the 443 server{} block.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Max upload size (for file uploads in the app)
    client_max_body_size 20M;

    # --------------------------------------------------
    # API & Sanctum routes → Laravel (PHP-FPM)
    # --------------------------------------------------
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /sanctum {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # --------------------------------------------------
    # Angular SPA → static files
    # --------------------------------------------------
    location / {
        # Serve Angular compiled files
        root /var/www/quel-pneu.ma/front-dist;
        try_files $uri $uri/ /index.html;

        # Never cache index.html so new deploys are picked up immediately
        # NB: an add_header inside a location drops every add_header of the
        # server block, so the security headers are repeated here.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        }
    }

    # Laravel public storage — ^~ stops nginx checking regex patterns so the
    # static-assets block below does not accidentally serve files from front-dist.
    # Uploaded files (logos, article photos) are served as inert content:
    # never run as a page (sandbox CSP), never sniffed into another type, and
    # no PHP — even if a file with a script in it were ever uploaded.
    location ^~ /storage/ {
        root /var/www/quel-pneu.ma/back/public;
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        location ~ \.(php|phtml|phar|html?|svgz?)$ { deny all; }
        access_log off;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /var/www/quel-pneu.ma/front-dist;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Block access to hidden files (.env, .git…) — but not Let's Encrypt.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
